# 本地钩子，装一次即可：pre-commit install（按 default_install_hook_types 装 commit-msg）。
# 写成 local：脚本就在本仓库里，跟着代码一起改，不需要额外的仓库或依赖。
#
# 手动全量检查：
#   pre-commit run --hook-stage commit-msg --commit-msg-filename <提交信息文件>
default_install_hook_types:
  - commit-msg

repos:
  - repo: local
    hooks:
      - id: commit-msg-format
        name: 校验提交信息格式
        entry: python scripts/check-commit-msg.py
        language: system
        stages:
          - commit-msg
