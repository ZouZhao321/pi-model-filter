name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run format:check
      - run: npm run check:pack

  commit-msg:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 校验提交信息格式
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git show -s --format=%B "${HEAD_SHA}" > "${RUNNER_TEMP}/commit-msg.txt"
            node scripts/check-commit-msg.mjs "${RUNNER_TEMP}/commit-msg.txt"
            exit 0
          fi
          for sha in $(git rev-list "${BASE_SHA}..${HEAD_SHA}"); do
            git show -s --format=%B "${sha}" > "${RUNNER_TEMP}/commit-msg.txt"
            node scripts/check-commit-msg.mjs "${RUNNER_TEMP}/commit-msg.txt"
          done
