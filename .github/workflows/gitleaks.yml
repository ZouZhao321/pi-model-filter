name: gitleaks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 不用 gitleaks-action：它按推送事件区间取扫描范围，强推或压缩历史后区间起点失效会误报失败。
      # 这里固定版本并对全历史扫描，结果与事件类型无关。
      - name: 安装 gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL "${base}/${archive}" -o "${RUNNER_TEMP}/${archive}"
          curl -sSfL "${base}/gitleaks_${version}_checksums.txt" -o "${RUNNER_TEMP}/checksums.txt"
          expected="$(awk -v name="${archive}" '$2 == name { print $1 }' "${RUNNER_TEMP}/checksums.txt")"
          actual="$(sha256sum "${RUNNER_TEMP}/${archive}" | awk '{ print $1 }')"
          if [ -z "${expected}" ] || [ "${expected}" != "${actual}" ]; then
            echo "gitleaks 校验和不匹配：expected=${expected} actual=${actual}"
            exit 1
          fi
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
      - name: 扫描全历史
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/gitleaks" git --log-opts="--all" --redact --exit-code 1 --no-banner .
